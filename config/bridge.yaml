# ros_gz_bridge configuration for pady_robot
# Separating ros_topic_name and gz_topic_name avoids the SIGABRT crash that
# occurs when the bridge tries to validate the gz path (which contains "/0/")
# as a ROS2 topic name.

# Clock bridge — essential for use_sim_time nodes
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# World pose bridge — base_link height for gait analysis
- ros_topic_name: "/world/pady_poses"
  gz_topic_name: "/world/slope_world/dynamic_pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/slope_world/model/pady/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Hip force topics for ApplyJointForce gait kick.
# Each Float64 message → one sim-step of torque (Nm). Silent = passive.
- ros_topic_name: "/hip_kick_right"
  gz_topic_name: "/model/pady/joint/hip_joint_right/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/hip_kick_left"
  gz_topic_name: "/model/pady/joint/hip_joint_left/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/base_push"
  gz_topic_name: "/model/pady/link/base_link/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Arm force topics for counterswing initiation
- ros_topic_name: "/arm_kick_right"
  gz_topic_name: "/model/pady/joint/arm_joint_right/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm_kick_left"
  gz_topic_name: "/model/pady/joint/arm_joint_left/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ