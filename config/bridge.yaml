# ros_gz_bridge configuration for pady_robot
# Separating ros_topic_name and gz_topic_name avoids the SIGABRT crash that
# occurs when the bridge tries to validate the gz path (which contains "/0/")
# as a ROS2 topic name.
#
# Where to tune:
# - Usually do NOT tune numeric gait behavior here.
# - Edit this file only when topic names or message types change.
# - Runtime gait tuning is done via launch args in spawn/analysis/headless.

# Clock bridge — essential for use_sim_time nodes
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Model pose bridge — PosePublisher plugin → geometry_msgs/Pose for gait analysis
- ros_topic_name: "/pady/pose"
  gz_topic_name: "/model/pady/pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/slope_world/model/pady/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Hip/body force command topics.
# Each Float64 message is interpreted as force/torque command for the current step.
# No messages (or publishing 0.0) keeps those channels effectively passive.
- ros_topic_name: "/hip_kick_right"
  gz_topic_name: "/model/pady/joint/hip_joint_right/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/hip_kick_left"
  gz_topic_name: "/model/pady/joint/hip_joint_left/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/base_push"
  gz_topic_name: "/model/pady/link/base_link/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/knee_lock_right"
  gz_topic_name: "/model/pady/joint/knee_joint_right/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/knee_lock_left"
  gz_topic_name: "/model/pady/joint/knee_joint_left/0/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ